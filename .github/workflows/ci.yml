name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: noshorts-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      # 폰에서 바로 받을 수 있게 최신 APK를 "debug-latest" 릴리스에 올린다.
      # (Actions 아티팩트는 zip이고 모바일 웹에서 내려받기 어렵다.)
      - name: Publish debug APK to release
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk noshorts-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest noshorts-debug.apk \
            --prerelease \
            --target "$TARGET_SHA" \
            --title "최신 테스트 빌드" \
            --notes "커밋 $TARGET_SHA 에서 빌드한 테스트용 APK입니다. 폰에서 noshorts-debug.apk를 눌러 설치하세요."
